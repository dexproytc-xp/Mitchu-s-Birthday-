<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mishma! ✨</title>
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #00f3ff;
            --bg: #0a0a16;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .portal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0033 0%, #050010 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .portal-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .portal-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
            animation: pulse 2s infinite;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 127, 0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(0, 243, 255, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 127, 0.6); }
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease;
        }

        .main-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .glow-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff007f, #00f3ff, #ffea00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .name-tag {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 40px var(--secondary);
            margin-bottom: 25px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .cake-container {
            margin: 30px auto;
            position: relative;
            width: 150px;
            height: 120px;
            cursor: pointer;
        }

        .cake-layer {
            position: absolute;
            width: 100%;
            background: linear-gradient(to right, #ff007f, #ff66b2);
            border-radius: 12px 12px 0 0;
        }

        .layer-1 { height: 40px; bottom: 0; width: 100%; }
        .layer-2 { height: 35px; bottom: 40px; width: 80%; left: 10%; background: linear-gradient(to right, #00f3ff, #80f9ff); }
        .layer-3 { height: 30px; bottom: 75px; width: 60%; left: 20%; background: linear-gradient(to right, #ffea00, #fff580); }

        .candle {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 15px;
            background: #fff;
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 14px;
            background: #ff9900;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 10px #ff9900, 0 0 20px #ff0000;
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.15); }
        }

        .flame.off {
            display: none;
        }

        .instruction {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 10px;
        }

        .action-btn {
            background: transparent;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            font-weight: 600;
        }

        .action-btn:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 20px var(--secondary);
        }

        .wish-box {
            margin-top: 25px;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0e0e0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="portal-overlay" id="portal">
        <h2 style="margin-bottom: 20px; letter-spacing: 3px; color: #00f3ff;">A SPECIAL SURPRISE AWAITS</h2>
        <button class="portal-btn" onclick="openPortal()">TOUCH TO UNLOCK ✨</button>
    </div>

    <div class="main-container" id="mainContent">
        <div class="card">
            <h1 class="glow-title">HAPPY BIRTHDAY</h1>
            <div class="name-tag">MISHMA</div>

            <div class="cake-container" onclick="blowCandle()">
                <div class="candle">
                    <div class="flame" id="flame"></div>
                </div>
                <div class="cake-layer layer-3"></div>
                <div class="cake-layer layer-2"></div>
                <div class="cake-layer layer-1"></div>
            </div>
            <div class="instruction" id="cakeInstruction">Tap the candle flame to blow it out! 🎂</div>

            <div class="wish-box" id="wishText">
                Wishing you a year filled with endless opportunities, happiness, and incredible achievements! ✨
            </div>

            <button class="action-btn" onclick="generateWish()">SURPRISE WISH ✨</button>
        </div>
    </div>

    <div class="audio-control" onclick="toggleAudio()" id="audioBtn">🎵 Music: ON</div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) {
            particles.push(new Particle());
        }

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        let audioCtx, oscillator;
        let isMuted = false;

        function playBgTune() {
            if (isMuted) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 261.63, 293.66, 261.63, 349.23, 329.63];
                let i = 0;
                setInterval(() => {
                    if (isMuted || !audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[i % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    i++;
                }, 500);
            } catch (e) {}
        }

        function toggleAudio() {
            isMuted = !isMuted;
            document.getElementById('audioBtn').innerText = isMuted ? '🔇 Music: OFF' : '🎵 Music: ON';
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function openPortal() {
            document.getElementById('portal').classList.add('hidden');
            document.getElementById('mainContent').classList.add('active');
            playBgTune();
            triggerConfetti();
        }

        let flameBlown = false;
        function blowCandle() {
            if (!flameBlown) {
                document.getElementById('flame').classList.add('off');
                document.getElementById('cakeInstruction').innerText = '🎉 Make a Wish! 🎉';
                triggerConfetti();
                flameBlown = true;
            }
        }

        const wishes = [
            "May your year ahead be filled with happiness, success, and endless wonderful moments! 🌟",
            "Keep shining brightly and achieving all your dreams, Mishma! 🚀",
            "May every single step you take bring you closer to extraordinary greatness! ✨",
            "Wishing you good health, unconditional love, and infinite smiles today and always! 💖"
        ];
        let wishIndex = 0;

        function generateWish() {
            wishIndex = (wishIndex + 1) % wishes.length;
            document.getElementById('wishText').innerText = wishes[wishIndex];
            triggerConfetti();
        }
    </script>
</body>
</html>
